<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchdog - 监控区域配置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-primary, #f5f5f5);
    color: var(--text-primary, #1a1a1a);
    padding: 16px;
  }

  .layout { display: flex; gap: 16px; flex-wrap: wrap; }

  /* Left: Canvas Panel */
  .canvas-panel {
    flex: 1 1 580px;
    min-width: 400px;
    background: var(--bg-secondary, #fff);
    border: 1px solid var(--border-primary, #e0e0e0);
    border-radius: 8px;
    overflow: hidden;
  }
  .canvas-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-primary, #e0e0e0);
    flex-wrap: wrap;
  }
  .canvas-toolbar .btn {
    padding: 6px 14px; border: 1px solid var(--border-primary, #d0d0d0);
    border-radius: 6px; background: var(--bg-secondary, #fff);
    color: var(--text-primary, #333); cursor: pointer; font-size: 13px;
    transition: all 0.15s;
  }
  .canvas-toolbar .btn:hover { background: var(--bg-hover, #f0f0f0); }
  .canvas-toolbar .btn.active { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }
  .canvas-toolbar .btn.danger { color: #ef4444; border-color: #fca5a5; }
  .canvas-toolbar .btn.danger:hover { background: #fef2f2; }
  .canvas-toolbar .separator { width: 1px; height: 24px; background: var(--border-primary, #e0e0e0); }
  .canvas-toolbar .hint { font-size: 12px; color: var(--text-secondary, #888); margin-left: auto; }

  .canvas-wrap {
    position: relative; width: 100%; overflow: auto;
    background: #1a1a1a; min-height: 300px;
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-wrap canvas {
    display: block; cursor: default;
  }
  .canvas-wrap canvas.draw-mode { cursor: crosshair; }
  .canvas-wrap .no-image {
    display: flex; align-items: center; justify-content: center;
    height: 400px; color: #999; font-size: 15px;
  }

  .region-info {
    padding: 8px 12px; font-size: 12px;
    border-top: 1px solid var(--border-primary, #e0e0e0);
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    color: var(--text-secondary, #888);
  }
  .region-info .count { font-weight: 600; color: var(--text-primary, #333); }

  /* Right: Config Panel */
  .config-panel {
    flex: 0 0 340px; min-width: 280px;
    background: var(--bg-secondary, #fff);
    border: 1px solid var(--border-primary, #e0e0e0);
    border-radius: 8px; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    max-height: 680px; overflow-y: auto;
  }
  .config-panel h3 {
    font-size: 15px; font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-primary, #e0e0e0);
  }

  /* Region list */
  .region-list { display: flex; flex-direction: column; gap: 6px; }
  .region-card {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--border-primary, #e0e0e0);
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
    font-size: 13px;
  }
  .region-card:hover { background: var(--bg-hover, #f8f8f8); }
  .region-card.selected { border-color: #3b82f6; background: #eff6ff; }
  .region-card .color-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .region-card .region-name {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500;
  }
  .region-card .alert-badge {
    font-size: 11px; padding: 1px 6px; border-radius: 4px;
    flex-shrink: 0;
  }
  .alert-badge.missing { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .alert-badge.appeared { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .alert-badge.changed { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
  .region-card .btn-del {
    width: 22px; height: 22px; border: none; background: none;
    color: #999; cursor: pointer; font-size: 16px; line-height: 1;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .region-card .btn-del:hover { background: #fef2f2; color: #ef4444; }

  .empty-hint {
    font-size: 13px; color: var(--text-secondary, #999);
    text-align: center; padding: 20px 0;
  }

  /* Edit form */
  .edit-section {
    border-top: 1px solid var(--border-primary, #e0e0e0);
    padding-top: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .edit-section .edit-title {
    font-size: 13px; font-weight: 600; color: var(--text-primary, #333);
    display: flex; align-items: center; gap: 6px;
  }
  .edit-section .edit-title .color-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--text-secondary, #555); }
  .form-group select, .form-group input, .form-group textarea {
    padding: 7px 10px; border: 1px solid var(--border-primary, #d0d0d0);
    border-radius: 6px; font-size: 13px;
    background: var(--bg-primary, #fff); color: var(--text-primary, #333);
    font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
    outline: none; border-color: #3b82f6;
  }

  .config-actions { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .config-actions .btn-primary {
    padding: 10px 16px; background: #3b82f6; color: #fff;
    border: none; border-radius: 6px; font-size: 14px;
    cursor: pointer; transition: background 0.15s; font-weight: 500;
  }
  .config-actions .btn-primary:hover { background: #2563eb; }
  .config-actions .btn-primary:disabled {
    background: #93c5fd; cursor: not-allowed;
  }

  /* JSON output */
  .json-panel {
    width: 100%; margin-top: 12px;
    background: var(--bg-secondary, #fff);
    border: 1px solid var(--border-primary, #e0e0e0);
    border-radius: 8px; overflow: hidden;
    display: none;
  }
  .json-panel.visible { display: block; }
  .json-header {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    background: var(--bg-primary, #f9f9f9);
    border-bottom: 1px solid var(--border-primary, #e0e0e0);
    display: flex; justify-content: space-between; align-items: center;
  }
  .json-header .btn-sm {
    padding: 4px 10px; font-size: 12px;
    border: 1px solid var(--border-primary, #d0d0d0);
    border-radius: 4px; background: var(--bg-secondary, #fff);
    cursor: pointer; color: var(--text-primary, #555);
  }
  .json-header .btn-sm:hover { background: var(--bg-hover, #f0f0f0); }
  .json-body {
    padding: 12px; font-family: "Fira Code", "Consolas", "Monaco", monospace;
    font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
    max-height: 300px; overflow: auto;
    color: var(--text-primary, #333);
  }

  /* Status bar */
  .status-bar {
    margin-top: 8px; padding: 8px 12px;
    border-radius: 6px; font-size: 13px; display: none;
  }
  .status-bar.success { display: block; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
  .status-bar.error   { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .status-bar.info    { display: block; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }

  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .canvas-panel { min-width: unset; }
    .config-panel { flex: 1 1 auto; max-height: none; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Left: Canvas Panel -->
  <div class="canvas-panel">
    <div class="canvas-toolbar">
      <button class="btn" id="btnDraw" onclick="toggleDrawMode()">添加区域</button>
      <div class="separator"></div>
      <button class="btn" onclick="undoLast()">撤销</button>
      <button class="btn danger" onclick="clearAll()">清除所有</button>
      <span class="hint" id="drawHint">点击"添加区域"后在画面上拖拽绘制矩形</span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="drawCanvas"></canvas>
    </div>
    <div class="region-info" id="regionInfo">
      <span>区域数量: <span class="count" id="regionCount">0</span></span>
      <span style="margin-left:auto" id="imgInfo"></span>
    </div>
  </div>

  <!-- Right: Config Panel -->
  <div class="config-panel">
    <h3>监控区域配置</h3>

    <div class="region-list" id="regionList">
      <div class="empty-hint" id="emptyHint">暂无监控区域，请在左侧画面上绘制</div>
    </div>

    <div class="edit-section" id="editSection" style="display:none">
      <div class="edit-title">
        <span class="color-dot" id="editDot"></span>
        <span id="editLabel">编辑区域</span>
      </div>
      <div class="form-group">
        <label>区域名称</label>
        <input type="text" id="inputName" placeholder="如：灭火器位置" oninput="onEditChange()">
      </div>
      <div class="form-group">
        <label>监控规则描述</label>
        <textarea id="inputRule" placeholder="描述该区域应监控的内容，如：此区域应始终有一个红色灭火器" oninput="onEditChange()"></textarea>
      </div>
      <div class="form-group">
        <label>报警类型</label>
        <select id="inputAlert" onchange="onEditChange()">
          <option value="missing">物品消失 (missing)</option>
          <option value="appeared">物品出现 (appeared)</option>
          <option value="changed">状态变化 (changed)</option>
        </select>
      </div>
    </div>

    <div class="config-actions">
      <button class="btn-primary" id="btnGenerate" onclick="generateConfig()">
        生成配置
      </button>
    </div>
  </div>
</div>

<!-- JSON Output -->
<div class="json-panel" id="jsonPanel">
  <div class="json-header">
    <span>生成的监控配置数据</span>
    <button class="btn-sm" onclick="copyJSON()">复制</button>
  </div>
  <div class="json-body" id="jsonOutput"></div>
</div>

<div class="status-bar" id="statusBar"></div>

<script>
// ========== Constants ==========
var COLOR_PALETTE = [
  '#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6',
  '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1'
];
var ALERT_LABELS = { missing: '物品消失', appeared: '物品出现', changed: '状态变化' };

// ========== State ==========
var widgetData = window.__WIDGET_DATA__ || {};
var imageUrl = widgetData.imageUrl || '';
var localPath = widgetData.localPath || '';
var deviceSn = widgetData.deviceSn || '';
var deviceName = widgetData.deviceName || '';
var imageWidth = widgetData.imageWidth || 0;
var imageHeight = widgetData.imageHeight || 0;
var existingRegions = widgetData.existingRegions || [];

var regions = [];
var selectedIdx = -1;
var isDrawMode = false;
var dragStart = null;
var isDragging = false;
var nextRegionId = 1;

var img = null;
var canvasW = 0, canvasH = 0;
var scaleRatio = 1;

var canvas = document.getElementById('drawCanvas');
var ctx = canvas.getContext('2d');

// ========== Coordinate Conversion ==========
function displayToPixel(dx, dy) {
  return {
    x: Math.round(dx / scaleRatio),
    y: Math.round(dy / scaleRatio)
  };
}

function pixelToDisplay(px, py) {
  return {
    x: Math.round(px * scaleRatio),
    y: Math.round(py * scaleRatio)
  };
}

// ========== Init ==========
function init() {
  if (!imageUrl) {
    document.getElementById('canvasWrap').innerHTML =
      '<div class="no-image">暂无图片 - 请提供设备抓图URL</div>';
    return;
  }

  img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    canvasW = img.naturalWidth || imageWidth || 1920;
    canvasH = img.naturalHeight || imageHeight || 1080;

    var container = document.getElementById('canvasWrap');
    var maxW = Math.min(container.clientWidth || 900, 900);
    scaleRatio = Math.min(maxW / canvasW, 600 / canvasH, 1);

    var displayW = Math.round(canvasW * scaleRatio);
    var displayH = Math.round(canvasH * scaleRatio);

    canvas.width = displayW;
    canvas.height = displayH;
    canvas.style.width = displayW + 'px';
    canvas.style.height = displayH + 'px';

    document.getElementById('imgInfo').textContent = canvasW + ' x ' + canvasH + ' px';

    // Load existing regions if editing
    if (existingRegions.length > 0) {
      for (var i = 0; i < existingRegions.length; i++) {
        var er = existingRegions[i];
        regions.push({
          id: er.id || 'region_' + nextRegionId,
          name: er.name || '区域 ' + nextRegionId,
          x: er.x, y: er.y,
          width: er.width, height: er.height,
          rule: er.rule || '',
          alert_when: er.alert_when || 'missing',
          color: COLOR_PALETTE[i % COLOR_PALETTE.length]
        });
        nextRegionId++;
      }
      updateRegionList();
    }

    redraw();
  };
  img.onerror = function() {
    document.getElementById('canvasWrap').innerHTML =
      '<div class="no-image">图片加载失败 - 请检查URL是否有效或已过期</div>';
  };
  img.src = imageUrl;
}

// ========== Draw Mode Toggle ==========
function toggleDrawMode() {
  isDrawMode = !isDrawMode;
  var btn = document.getElementById('btnDraw');
  if (isDrawMode) {
    btn.classList.add('active');
    btn.textContent = '绘制中...';
    canvas.classList.add('draw-mode');
    document.getElementById('drawHint').textContent = '在画面上按住鼠标拖拽绘制矩形区域';
  } else {
    btn.classList.remove('active');
    btn.textContent = '添加区域';
    canvas.classList.remove('draw-mode');
    document.getElementById('drawHint').textContent = '点击"添加区域"后在画面上拖拽绘制矩形';
  }
}

// ========== Canvas Mouse Events ==========
canvas.addEventListener('mousedown', function(e) {
  if (!img || !isDrawMode) return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  isDragging = true;
});

canvas.addEventListener('mousemove', function(e) {
  if (!img) return;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  if (isDragging && dragStart) {
    redraw();
    // Draw preview rectangle (dashed)
    var sx = Math.min(dragStart.x, mx);
    var sy = Math.min(dragStart.y, my);
    var sw = Math.abs(mx - dragStart.x);
    var sh = Math.abs(my - dragStart.y);

    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.restore();

    // Show pixel dimensions
    var tl = displayToPixel(sx, sy);
    var br = displayToPixel(sx + sw, sy + sh);
    var pw = br.x - tl.x;
    var ph = br.y - tl.y;
    ctx.save();
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#3b82f6';
    ctx.fillText(pw + ' x ' + ph + ' px', sx + 4, sy - 6);
    ctx.restore();
  }
});

canvas.addEventListener('mouseup', function(e) {
  if (!img || !isDragging || !dragStart) return;
  e.preventDefault();
  isDragging = false;

  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  // Calculate rectangle in display coords
  var sx = Math.min(dragStart.x, mx);
  var sy = Math.min(dragStart.y, my);
  var sw = Math.abs(mx - dragStart.x);
  var sh = Math.abs(my - dragStart.y);

  dragStart = null;

  // Minimum size check (at least 5px in display)
  if (sw < 5 || sh < 5) {
    redraw();
    return;
  }

  // Convert to pixel coordinates
  var tl = displayToPixel(sx, sy);
  var br = displayToPixel(sx + sw, sy + sh);

  var regionIdx = regions.length;
  var colorIdx = regionIdx % COLOR_PALETTE.length;
  var region = {
    id: 'region_' + nextRegionId,
    name: '区域 ' + nextRegionId,
    x: tl.x,
    y: tl.y,
    width: br.x - tl.x,
    height: br.y - tl.y,
    rule: '',
    alert_when: 'missing',
    color: COLOR_PALETTE[colorIdx]
  };
  nextRegionId++;
  regions.push(region);

  // Exit draw mode
  if (isDrawMode) {
    toggleDrawMode();
  }

  // Select the new region
  selectedIdx = regions.length - 1;
  updateRegionList();
  showEditForm(selectedIdx);
  redraw();
  showStatus('已添加区域: ' + region.name, 'success');
});

// Click on canvas to select region
canvas.addEventListener('click', function(e) {
  if (!img || isDrawMode) return;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  // Check if click is inside any region (reverse order for top-most)
  var found = -1;
  for (var i = regions.length - 1; i >= 0; i--) {
    var r = regions[i];
    var tl = pixelToDisplay(r.x, r.y);
    var br = pixelToDisplay(r.x + r.width, r.y + r.height);
    if (mx >= tl.x && mx <= br.x && my >= tl.y && my <= br.y) {
      found = i;
      break;
    }
  }

  if (found >= 0) {
    selectedIdx = found;
    updateRegionList();
    showEditForm(found);
    redraw();
  } else {
    selectedIdx = -1;
    updateRegionList();
    hideEditForm();
    redraw();
  }
});

// ========== Drawing ==========
function redraw() {
  if (!img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  for (var i = 0; i < regions.length; i++) {
    drawRegionRect(i);
  }
}

function drawRegionRect(idx) {
  var r = regions[idx];
  var tl = pixelToDisplay(r.x, r.y);
  var br = pixelToDisplay(r.x + r.width, r.y + r.height);
  var w = br.x - tl.x;
  var h = br.y - tl.y;
  var isSelected = (idx === selectedIdx);

  ctx.save();

  // Fill
  ctx.fillStyle = hexToRgba(r.color, 0.12);
  ctx.fillRect(tl.x, tl.y, w, h);

  // Border
  ctx.strokeStyle = r.color;
  ctx.lineWidth = isSelected ? 3 : 2;
  if (!isSelected) {
    ctx.setLineDash([]);
  }
  ctx.strokeRect(tl.x, tl.y, w, h);

  // Label background
  var labelText = (idx + 1) + '. ' + r.name;
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  var textWidth = ctx.measureText(labelText).width;
  var labelH = 20;
  var labelPad = 4;

  ctx.fillStyle = r.color;
  ctx.fillRect(tl.x, tl.y - labelH, textWidth + labelPad * 2, labelH);

  // Label text
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(labelText, tl.x + labelPad, tl.y - labelH / 2);

  // Selection handles
  if (isSelected) {
    var handleSize = 6;
    ctx.fillStyle = r.color;
    // Four corners
    ctx.fillRect(tl.x - handleSize / 2, tl.y - handleSize / 2, handleSize, handleSize);
    ctx.fillRect(br.x - handleSize / 2, tl.y - handleSize / 2, handleSize, handleSize);
    ctx.fillRect(tl.x - handleSize / 2, br.y - handleSize / 2, handleSize, handleSize);
    ctx.fillRect(br.x - handleSize / 2, br.y - handleSize / 2, handleSize, handleSize);
  }

  ctx.restore();
}

function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// ========== Region List ==========
function updateRegionList() {
  var list = document.getElementById('regionList');
  var hint = document.getElementById('emptyHint');

  // Remove old cards
  var oldCards = list.querySelectorAll('.region-card');
  for (var i = 0; i < oldCards.length; i++) {
    list.removeChild(oldCards[i]);
  }

  if (regions.length === 0) {
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }

  for (var i = 0; i < regions.length; i++) {
    var r = regions[i];
    var card = document.createElement('div');
    card.className = 'region-card' + (i === selectedIdx ? ' selected' : '');
    card.setAttribute('data-idx', i);

    var dot = document.createElement('span');
    dot.className = 'color-dot';
    dot.style.background = r.color;

    var name = document.createElement('span');
    name.className = 'region-name';
    name.textContent = (i + 1) + '. ' + r.name;

    var badge = document.createElement('span');
    badge.className = 'alert-badge ' + r.alert_when;
    badge.textContent = ALERT_LABELS[r.alert_when] || r.alert_when;

    var del = document.createElement('button');
    del.className = 'btn-del';
    del.textContent = '\u00d7';
    del.setAttribute('data-idx', i);

    card.appendChild(dot);
    card.appendChild(name);
    card.appendChild(badge);
    card.appendChild(del);
    list.appendChild(card);

    // Click to select
    (function(idx) {
      card.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-del')) return;
        selectedIdx = idx;
        updateRegionList();
        showEditForm(idx);
        redraw();
      });
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteRegion(idx);
      });
    })(i);
  }

  document.getElementById('regionCount').textContent = regions.length;
}

function deleteRegion(idx) {
  var name = regions[idx].name;
  regions.splice(idx, 1);
  if (selectedIdx === idx) {
    selectedIdx = -1;
    hideEditForm();
  } else if (selectedIdx > idx) {
    selectedIdx--;
  }
  updateRegionList();
  redraw();
  showStatus('已删除区域: ' + name, 'info');
}

// ========== Edit Form ==========
function showEditForm(idx) {
  var section = document.getElementById('editSection');
  var r = regions[idx];
  section.style.display = 'flex';

  document.getElementById('editDot').style.background = r.color;
  document.getElementById('editLabel').textContent = '编辑: ' + (idx + 1) + '. ' + r.name;
  document.getElementById('inputName').value = r.name;
  document.getElementById('inputRule').value = r.rule || '';
  document.getElementById('inputAlert').value = r.alert_when || 'missing';
}

function hideEditForm() {
  document.getElementById('editSection').style.display = 'none';
}

function onEditChange() {
  if (selectedIdx < 0 || selectedIdx >= regions.length) return;
  var r = regions[selectedIdx];
  r.name = document.getElementById('inputName').value || ('区域 ' + (selectedIdx + 1));
  r.rule = document.getElementById('inputRule').value;
  r.alert_when = document.getElementById('inputAlert').value;

  document.getElementById('editLabel').textContent = '编辑: ' + (selectedIdx + 1) + '. ' + r.name;
  updateRegionList();
  redraw();
}

// ========== Actions ==========
function undoLast() {
  if (regions.length === 0) {
    showStatus('没有可撤销的区域', 'info');
    return;
  }
  var removed = regions.pop();
  if (selectedIdx === regions.length) {
    selectedIdx = -1;
    hideEditForm();
  }
  updateRegionList();
  redraw();
  showStatus('已撤销区域: ' + removed.name, 'info');
}

function clearAll() {
  if (regions.length === 0) {
    showStatus('没有可清除的区域', 'info');
    return;
  }
  if (!confirm('确定要清除所有 ' + regions.length + ' 个监控区域吗？')) return;
  regions = [];
  selectedIdx = -1;
  hideEditForm();
  updateRegionList();
  redraw();
  showStatus('所有区域已清除', 'info');
}

// ========== Config Generation ==========
function generateConfig() {
  if (regions.length === 0) {
    showStatus('请至少绘制一个监控区域', 'error');
    return;
  }

  var regionConfigs = [];
  for (var i = 0; i < regions.length; i++) {
    var r = regions[i];
    regionConfigs.push({
      id: r.id,
      name: r.name,
      x: r.x,
      y: r.y,
      width: r.width,
      height: r.height,
      rule: r.rule,
      alert_when: r.alert_when
    });
  }

  var config = {
    device_sn: deviceSn,
    device_name: deviceName,
    source_image: localPath,
    regions: regionConfigs,
    image_size: { width: canvasW || imageWidth, height: canvasH || imageHeight }
  };

  var jsonStr = JSON.stringify(config, null, 2);
  document.getElementById('jsonOutput').textContent = jsonStr;
  document.getElementById('jsonPanel').classList.add('visible');
  showStatus('配置已生成，包含 ' + regions.length + ' 个监控区域', 'success');
}

function copyJSON() {
  var text = document.getElementById('jsonOutput').textContent;
  if (!text) {
    showStatus('没有可复制的内容', 'info');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showStatus('已复制到剪贴板', 'success');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showStatus('已复制到剪贴板', 'success');
  } catch (err) {
    showStatus('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(ta);
}

// ========== Status Bar ==========
function showStatus(msg, type) {
  var bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar ' + type;
  clearTimeout(bar._timer);
  bar._timer = setTimeout(function() {
    bar.style.display = 'none';
    bar.className = 'status-bar';
  }, 4000);
}

// ========== Init ==========
init();
</script>
